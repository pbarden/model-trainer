[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-tea"
version = "2.0.0"
description = "CPU-optimized language model training system with RL optimization and intelligent memory"
readme = "README.md"
license = "MIT"
authors = [{name = "ChaiQ LLC"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.30.0,<5.0.0",
    "datasets>=2.10.0,<3.0.0",
    "numpy>=1.21.0,<2.0.0",
    "pandas>=1.3.0,<3.0.0",
    "scipy>=1.7.0,<2.0.0",
    "scikit-learn>=1.0.0,<2.0.0",
    "tqdm>=4.60.0,<5.0.0",
    "matplotlib>=3.5.0,<4.0.0",
    "jsonlines>=3.0.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "pytest-html>=3.1.0",
    "pytest-json-report>=1.5.0",
    "pytest-benchmark>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
    "coverage[toml]>=6.0.0",
    "memory-profiler>=0.60.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "scipy>=1.10.0",
    "numpy>=1.21.0",
]
evaluation = [
    "seaborn>=0.11.0",
    "nltk>=3.7",
    "rouge-score>=0.1.2",
]
visualization = [
    "plotly>=5.0.0",
    "bokeh>=2.4.0",
    "dash>=2.0.0",
]
all = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "pytest-html>=3.1.0",
    "pytest-json-report>=1.5.0",
    "pytest-benchmark>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
    "coverage[toml]>=6.0.0",
    "memory-profiler>=0.60.0",
    "seaborn>=0.11.0",
    "nltk>=3.7",
    "rouge-score>=0.1.2",
    "plotly>=5.0.0",
    "bokeh>=2.4.0",
    "dash>=2.0.0",
]

# CLI scripts will be implemented in future versions
# [project.scripts]

[project.urls]
Homepage = "https://github.com/chaiq-llc/model-trainer"
Repository = "https://github.com/chaiq-llc/model-trainer.git"
Issues = "https://github.com/chaiq-llc/model-trainer/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=. --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | archive
)/
'''

[tool.setuptools.packages.find]
include = ["model_tea*"]
exclude = ["novels*", "archive*", "testing_outputs*", "iterative_models*", "pipeline_results*", "episodic_memories*", "backup_original_files*", "MagicMock*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true