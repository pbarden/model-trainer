[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-tea"
version = "2.0.0"
description = "CPU-optimized language model training system with progressive difficulty training"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "ChaiQ LLC"}]
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0,<3.0.0",
    "transformers>=4.30.0,<5.0.0",
    "datasets>=2.10.0,<3.0.0",
    "numpy>=1.21.0,<2.0.0",
    "peft>=0.5.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
]

[project.scripts]
model-tea = "model_tea.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["model_tea*"]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
